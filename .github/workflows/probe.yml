name: 数据源探测
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "===== A. extwitter 直连 ====="
          curl -sL -o /tmp/a.txt -w "HTTP %{http_code} size %{size_download}\n" --connect-timeout 10 --max-time 25 "https://extwitter.com/thsottiaux" || echo CURL FAIL
          head -c 400 /tmp/a.txt | tr '\n' ' '; echo; echo
          echo "===== B. r.jina.ai 转取 extwitter ====="
          curl -sL -o /tmp/b.txt -w "HTTP %{http_code} size %{size_download}\n" --connect-timeout 10 --max-time 30 "https://r.jina.ai/https://extwitter.com/thsottiaux" || echo CURL FAIL
          head -c 800 /tmp/b.txt | tr '\n' ' '; echo; echo
          echo "===== C. r.jina.ai 转取 x.com 移动版 ====="
          curl -sL -o /tmp/c.txt -w "HTTP %{http_code} size %{size_download}\n" --connect-timeout 10 --max-time 30 "https://r.jina.ai/https://mobile.twitter.com/thsottiaux" || echo CURL FAIL
          head -c 400 /tmp/c.txt | tr '\n' ' '; echo
