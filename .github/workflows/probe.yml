name: 数据源探测
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "===== A. r.jina.ai 内容 ====="
          curl -sL -o /tmp/a.txt -w "HTTP %{http_code} size %{size_download}\n" --connect-timeout 10 --max-time 30 "https://r.jina.ai/https://x.com/thsottiaux"
          head -c 600 /tmp/a.txt | tr '\n' ' '; echo; echo
          echo "===== B. Nitter 存活实例 ====="
          for u in "https://nitter.adminforge.de/thsottiaux/rss" "https://nitter.privacydev.net/thsottiaux/rss" "https://nitter.tiekoetter.com/thsottiaux/rss" "https://nitter.pw/thsottiaux/rss" ; do
            echo "--- $u ---"
            curl -sL -o /tmp/b.txt -w "HTTP %{http_code} size %{size_download}" --connect-timeout 8 --max-time 20 "$u" || echo " CURL FAIL"
            echo; head -c 150 /tmp/b.txt | tr '\n' ' '; echo
          done
          echo "===== C. Wayback 最近快照 ====="
          curl -sL --connect-timeout 8 --max-time 15 "https://archive.org/wayback/available?url=x.com/thsottiaux&timestamp=20261016" || echo "CURL FAIL"; echo; echo
          echo "===== D. Google News RSS ====="
          curl -sL -o /tmp/d.txt -w "HTTP %{http_code} size %{size_download}\n" --connect-timeout 8 --max-time 15 "https://news.google.com/rss/search?q=thsottiaux"
          head -c 200 /tmp/d.txt | tr '\n' ' '; echo
